# Robot de MP3BIT: cada vez que subes algo al repo (por ejemplo, MP3 a music/),
#  1. genera songs.json y las portadas (covers/) a partir de toda la música del repo,
#  2. los guarda en el repo,
#  3. publica la app en GitHub Pages.
# Requisito (una sola vez): Settings → Pages → Source: GitHub Actions.
name: Publicar MP3BIT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # para guardar songs.json y covers/
  pages: write
  id-token: write

# Si subes varias tandas seguidas, se procesan en orden (ninguna se pierde)
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # la versión más reciente, incluida la lista que guardó el robot antes

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generar lista de canciones y portadas
        run: |
          pip install --quiet mutagen==1.47.0
          mkdir -p music
          python scripts/build_catalog.py --completo

      - name: Guardar la lista en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A songs.json
          git add -A covers 2>/dev/null || true   # puede no existir si ninguna canción tiene portada
          if git diff --cached --quiet; then
            echo "La lista no cambió."
          else
            git commit -m "Actualizar lista de canciones"
            git push
          fi

      - name: Preparar sitio
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./scripts --exclude=./_site -cf - . | tar -xf - -C _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
